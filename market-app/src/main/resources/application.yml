spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/market_db
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379


  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  liquibase:
    url: jdbc:postgresql://localhost:5433/market_db
    user: postgres
    password: postgres
    change-log: classpath:lq/db.changelog-master.xml

  messages:
    basename: messages
    encoding: UTF-8

server:
  error:
    whitelabel:
      enabled: false

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.web.reactive.result.method.annotation: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG